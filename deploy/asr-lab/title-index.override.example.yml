# Explicitly optional: only use together with docker-compose.asr-lab.yml.
# Reuses a read-only index file and read-only media root for verified candidates.
# It does not mount the production data directory or read production credentials.
services:
  asr-lab:
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --manifest
      - /models/model.json
      - --audio-root
      - /audio
      - --num-threads
      - "2"
      - --title-cache
      - /index/media-index.json
    volumes:
      - type: bind
        source: ${ASR_LAB_TITLE_INDEX:?Explicitly select an existing reviewed media index file}
        target: /index/media-index.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ASR_LAB_MEDIA_ROOT:?Explicitly select the media root matching index paths under /media}
        target: /media
        read_only: true
        bind:
          create_host_path: false
